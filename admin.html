<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avan Portfolio | Admin Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/admin-style.css">
</head>
<body>

    <!-- Back to Site Link -->
    <div class="back-to-site">
        <a href="index.html" class="btn btn-secondary">
            ← Back To Portfolio
        </a>
    </div>

    <!-- Login Section -->
    <div id="login-section" class="login-container">
        <div class="login-card">
            <h2>Admin Login</h2>
            <div id="login-error" class="error-message"></div>
            <form id="login-form">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" class="form-input" placeholder="admin" required autocomplete="username">
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" class="form-input" placeholder="••••••••" required autocomplete="current-password">
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 15px; box-shadow: 4px 4px 0 #000;">
                    Log In
                </button>
            </form>
        </div>
    </div>

    <!-- Dashboard Section -->
    <div id="dashboard-section" class="dashboard-container">
        <!-- Dashboard Header -->
        <header class="dashboard-header">
            <h1>Avan Control Panel</h1>
            <div class="header-actions">
                <button class="btn btn-secondary" onclick="resetToDefault()">
                    Reset to Default
                </button>
                <button class="btn btn-secondary" onclick="copyCodeConfig()" style="background: #A9C2FF;">
                    Copy JS Config
                </button>
                <button class="btn btn-primary" onclick="openAddModal()">
                    + Add Project
                </button>
                <button class="btn btn-danger" onclick="logout()">
                    Logout
                </button>
            </div>
        </header>

        <!-- Stats Section -->
        <div class="stats-grid">
            <div class="stat-card">
                <span class="label">Total Projects</span>
                <span class="value" id="stat-total-projects">0</span>
            </div>
            <div class="stat-card">
                <span class="label">Cumulative Views</span>
                <span class="value" id="stat-total-views">0</span>
            </div>
            <div class="stat-card" style="background: var(--color-accent-blue);">
                <span class="label">Most Popular</span>
                <span class="value" id="stat-popular-project" style="font-size: 1.4rem; font-weight: 900; margin-top: 8px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%;">None</span>
            </div>
        </div>

        <!-- Table Card -->
        <div class="table-card">
            <div class="table-header-row">
                <h3>Portfolio Projects List</h3>
            </div>
            <table class="project-table">
                <thead>
                    <tr>
                        <th style="width: 80px;">Image</th>
                        <th>Project Title</th>
                        <th style="width: 180px;">Category</th>
                        <th style="width: 140px;">Release Date</th>
                        <th style="width: 140px;">Views</th>
                        <th style="width: 160px;">Actions</th>
                    </tr>
                </thead>
                <tbody id="projects-table-body">
                    <!-- Loaded dynamically via js/admin.js -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- Project Dialog Modal -->
    <div id="project-modal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modal-title">Add New Project</h3>
                <button class="modal-close" onclick="closeModal()">×</button>
            </div>
            <form id="project-form">
                <div class="modal-body">
                    <input type="hidden" id="project-id">
                    
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                        <div class="form-group">
                            <label for="proj-title">Card Title (Short)</label>
                            <input type="text" id="proj-title" class="form-input" required placeholder="e.g. UNDO">
                        </div>
                        <div class="form-group">
                            <label for="proj-detail-title-input">Detail Title (Full)</label>
                            <input type="text" id="proj-detail-title-input" class="form-input" placeholder="e.g. UNDO - A Short Film">
                        </div>
                    </div>

                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                        <div class="form-group">
                            <label for="proj-category">Category</label>
                            <input list="category-options" id="proj-category" class="form-input" style="height: 48px; font-weight: 700; background: #fff;" required placeholder="e.g. Short Film">
                            <datalist id="category-options">
                                <!-- Default options -->
                                <option value="Music Video">
                                <option value="Short Film">
                                <option value="Docu-series">
                                <option value="Commercial">
                                <!-- Dynamic options loaded by JS -->
                            </datalist>
                        </div>
                        <div class="form-group">
                            <label for="proj-date">Release Date</label>
                            <input type="date" id="proj-date" class="form-input" style="height: 48px;" required>
                        </div>
                    </div>

                    <div style="display: grid; grid-template-columns: 1fr 2fr; gap: 20px;">
                        <div class="form-group">
                            <label for="proj-views">View Count</label>
                            <input type="text" id="proj-views" class="form-input" required placeholder="e.g. 25K+, 125000">
                        </div>
                        <div class="form-group">
                            <label for="proj-img-file">Thumbnail Image Upload</label>
                            <input type="file" id="proj-img-file" class="form-input" accept="image/*" style="padding: 9px 15px;">
                            <input type="hidden" id="proj-img-data">
                            <div id="proj-img-preview-container" style="margin-top: 10px; display: none;">
                                <img id="proj-img-preview" src="" style="width: 100%; max-height: 150px; object-fit: cover; border: 2px solid #000; box-shadow: 2px 2px 0 #000;">
                            </div>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="proj-desc">Project Description</label>
                        <textarea id="proj-desc" class="form-input" rows="4" style="resize: vertical; font-family: inherit;" required placeholder="Provide a compelling description of the project, including your role and visual direction..."></textarea>
                    </div>

                    <div class="form-group">
                        <label>Project Links</label>
                        <div id="proj-links-container" style="display: flex; flex-direction: column; gap: 15px;">
                            <!-- Dynamically added link fields -->
                        </div>
                        <button type="button" class="btn btn-secondary btn-sm" onclick="addLinkField()" style="align-self: flex-start; margin-top: 15px;">
                            + Add Another Link
                        </button>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" onclick="closeModal()">Cancel</button>
                    <button type="submit" class="btn btn-success">Save Project</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="toast">Action completed successfully</div>

    <script src="js/admin.js"></script>
</body>
</html>
